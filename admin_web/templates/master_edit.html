{% extends "base.html" %}

{% block title %}{{ 'Редактирование' if master else 'Добавление' }} мастера{% endblock %}

{% block header %}{{ 'Редактирование мастера' if master else 'Добавление нового мастера' }}{% endblock %}

{% block content %}
<form method="post" style="max-width: 500px; margin: 0 auto;">
    <div class="form-group">
        <label for="name">Имя *</label>
        <input type="text" id="name" name="name" value="{{ master.name if master else '' }}" required class="form-control">
    </div>
    <div class="form-group">
        <label for="specialization">Специализация</label>
        <input type="text" id="specialization" name="specialization" value="{{ master.specialization if master else '' }}" class="form-control" placeholder="Например: диагностика, двигатель, КПП">
    </div>
    <div class="form-group">
        <label for="phone">Телефон</label>
        <input type="text" id="phone" name="phone" value="{{ master.phone if master else '' }}" class="form-control" placeholder="+7 (999) 123-45-67">
    </div>
    {% if master %}
    <div class="form-group">
        <label>
            <input type="checkbox" name="is_active" {% if master.is_active %}checked{% endif %}> Активен
        </label>
    </div>
    {% endif %}
    <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <a href="{{ url_for('masters_list') }}" class="btn btn-warning">Отмена</a>
        <button type="submit" class="btn btn-success">Сохранить</button>
    </div>
</form>
{% endblock %}
