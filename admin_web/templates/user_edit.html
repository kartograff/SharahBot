{% extends "base.html" %}

{% block title %}Редактирование пользователя{% endblock %}

{% block header %}Редактирование пользователя{% endblock %}

{% block content %}
<form method="post" style="max-width: 600px; margin: 0 auto;">
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ user.email or '' }}" class="form-control">
    </div>
    
    <div class="form-group">
        <label for="address">Адрес</label>
        <textarea id="address" name="address" class="form-control" rows="2">{{ user.address or '' }}</textarea>
    </div>
    
    <div class="form-group">
        <label for="birth_date">Дата рождения</label>
        <input type="date" id="birth_date" name="birth_date" value="{{ user.birth_date or '' }}" class="form-control">
    </div>
    
    <div class="form-group">
        <label for="notes">Заметки</label>
        <textarea id="notes" name="notes" class="form-control" rows="4">{{ user.notes or '' }}</textarea>
    </div>
    
    <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <a href="{{ url_for('user_detail', user_id=user.user_id) }}" class="btn btn-warning">Отмена</a>
        <button type="submit" class="btn btn-success">Сохранить</button>
    </div>
</form>
{% endblock %}
